appId: com.postrove.app
productName: Postrove
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - package.json
extraResources:
  - from: .runtime
    to: .runtime
    filter:
      - "**/*"
asar: true
asarUnpack:
  - "**/*.node"
artifactName: Postrove-${version}-mac-arm64.${ext}
publish:
  provider: github
  owner: huggon1
  repo: postrove
  releaseType: draft
  channel: latest
mac:
  category: public.app-category.productivity
  icon: build/postrove.icns
  hardenedRuntime: true
  entitlements: packaging/entitlements.mac.plist
  entitlementsInherit: packaging/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
