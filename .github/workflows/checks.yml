name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  application:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:full
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: application-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
  windows-trial:
    name: Windows x64 installation trial
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run prepare:runtime
      - name: Build unsigned per-user installer
        run: npm run package:windows
      - name: Verify packaged executable
        run: npm run test:package
      - name: Verify install, restart, reinstall and uninstall
        run: npm run test:windows-installation
      - uses: actions/upload-artifact@v7
        with:
          name: postrove-windows-x64-trial-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
            release/build-manifest.json
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Verify Windows application behavior
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-trial-evidence
          path: |
            test-results/
            playwright-report/
            .tmp/package-verification/
            .tmp/windows-installation/
          if-no-files-found: warn
          retention-days: 14
