name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Reuse signed verification packages from a previous Release workflow run
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check version and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fx "# Postrove ${version}" "docs/releases/${version}.md"
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            test "${GITHUB_REF_NAME}" = "v${version}"
          fi
          git fetch origin main
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          fi
      - name: Verify reused package source
        if: github.event_name == 'workflow_dispatch' && inputs.package_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          set -euo pipefail
          [[ "${PACKAGE_RUN_ID}" =~ ^[0-9]+$ ]]
          metadata="${RUNNER_TEMP}/upgrade-source.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PACKAGE_RUN_ID}" > "${metadata}"
          source_sha=$(jq -er 'select(.path == ".github/workflows/release.yml") | .head_sha' "${metadata}")
          git fetch origin "${source_sha}"
          git diff --quiet "${source_sha}" "${GITHUB_SHA}" -- \
            src assets packaging electron-builder.yml scripts/app-build package.json package-lock.json \
            || { echo 'Production inputs changed; prepare fresh signed packages.'; exit 1; }

  package:
    needs: validate
    if: github.event_name == 'push' || inputs.package_run_id == ''
    runs-on: macos-15
    timeout-minutes: 30
    environment: release-signing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Import verified project signing certificate
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_CERT_SHA256: ${{ secrets.MAC_CERT_SHA256 }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          : "${MAC_CSC_LINK:?MAC_CSC_LINK is required}"
          : "${MAC_CSC_KEY_PASSWORD:?MAC_CSC_KEY_PASSWORD is required}"
          : "${MAC_CERT_SHA256:?MAC_CERT_SHA256 is required}"
          keychain_path="${RUNNER_TEMP}/postrove-release.keychain-db"
          p12_path="${RUNNER_TEMP}/postrove-release.p12"
          cert_path="${RUNNER_TEMP}/postrove-release.pem"
          cert_der_path="${RUNNER_TEMP}/postrove-release.cer"
          keychain_password=$(openssl rand -base64 32)
          default_keychain=$(security default-keychain -d user | tr -d '"')
          printf '%s' "${MAC_CSC_LINK}" | base64 -D > "${p12_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" "${default_keychain}"
          security import "${p12_path}" -k "${keychain_path}" \
            -P "${MAC_CSC_KEY_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}"
          openssl pkcs12 -in "${p12_path}" -clcerts -nokeys \
            -passin env:MAC_CSC_KEY_PASSWORD -out "${cert_path}"
          openssl x509 -in "${cert_path}" -outform DER -out "${cert_der_path}"
          fingerprint=$(openssl x509 -in "${cert_path}" -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d ':\r\n' | tr '[:lower:]' '[:upper:]')
          expected=$(printf '%s' "${MAC_CERT_SHA256}" | tr '[:lower:]' '[:upper:]')
          test "${fingerprint}" = "${expected}"
          sudo -n security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "${cert_der_path}"
          signing_identity=$(openssl x509 -in "${cert_path}" -noout -fingerprint -sha1 \
            | cut -d= -f2 | tr -d ':\r\n')
          security find-identity -v -p codesigning "${keychain_path}" \
            | grep -F "${signing_identity}"
          printf 'CSC_NAME=%s\n' "${signing_identity}" >> "${GITHUB_ENV}"
          printf 'CSC_KEYCHAIN=%s\n' "${keychain_path}" >> "${GITHUB_ENV}"
      - run: npm ci
      - run: npm run prepare:runtime
      - run: npm run package:app
      - name: Verify the signed application
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Postrove.app
          codesign -d -r- release/mac-arm64/Postrove.app > release/signing-requirement.txt 2>&1
          test -s release/mac-arm64/Postrove.app/Contents/Resources/app-update.yml
      - name: Verify packaged startup and restart
        run: npm run test:package
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-verification-evidence
          path: .tmp/package-verification/
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare signed upgrade packages
        if: github.event_name == 'workflow_dispatch'
        run: npm run prepare:upgrade
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: signed-upgrade-packages
          path: |
            .tmp/signed-upgrade/baseline/*.zip
            .tmp/signed-upgrade/candidate/*.zip
            .tmp/signed-upgrade/candidate/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: postrove-${{ github.run_id }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/build-manifest.json
            release/SHA256SUMS.txt
            release/signing-requirement.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && always()
        with:
          name: signed-upgrade-build-evidence
          path: .tmp/signed-upgrade/evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ]; then
            security delete-keychain "${CSC_KEYCHAIN}" || true
          fi
          find "${RUNNER_TEMP}" -maxdepth 1 -name 'postrove-release.*' -delete

  signed-upgrade:
    needs: [validate, package]
    if: always() && github.event_name == 'workflow_dispatch' && needs.validate.result == 'success' && (needs.package.result == 'success' || inputs.package_run_id != '')
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: signed-upgrade-packages
          path: .tmp/signed-upgrade/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run_id || github.run_id }}
      - name: Verify native upgrade on a clean runner
        run: npm run test:upgrade
        env:
          POSTROVE_UPGRADE_PACKAGE_RUN: ${{ inputs.package_run_id || github.run_id }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signed-upgrade-evidence
          path: .tmp/signed-upgrade/evidence/
          if-no-files-found: error
          retention-days: 14

  released-upgrade:
    needs: [validate, package]
    if: always() && needs.validate.result == 'success' && (needs.package.result == 'success' || inputs.package_run_id != '')
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Select the published baseline
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline_tag=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq '.tagName')
          [[ "${baseline_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(node -p "require('./package.json').version")
          printf 'version=%s\n' "${baseline_tag#v}" >> "${GITHUB_OUTPUT}"
          if [ "${baseline_tag}" != "v${version}" ]; then
            printf 'verify=true\n' >> "${GITHUB_OUTPUT}"
            gh release download "${baseline_tag}" --repo "${GITHUB_REPOSITORY}" \
              --pattern "Postrove-${baseline_tag#v}-mac-arm64.zip" \
              --pattern SHA256SUMS.txt --dir .tmp/released-upgrade/baseline
          fi
      - uses: actions/download-artifact@v8
        if: steps.baseline.outputs.verify == 'true'
        with:
          name: postrove-${{ inputs.package_run_id || github.run_id }}
          path: .tmp/released-upgrade/candidate/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run_id || github.run_id }}
      - name: Verify the published-to-candidate native upgrade
        if: steps.baseline.outputs.verify == 'true'
        run: npm run test:upgrade -- --released-baseline "$BASELINE_VERSION"
        env:
          BASELINE_VERSION: ${{ steps.baseline.outputs.version }}
          POSTROVE_UPGRADE_PACKAGE_RUN: ${{ inputs.package_run_id || github.run_id }}
      - uses: actions/upload-artifact@v7
        if: always() && steps.baseline.outputs.verify == 'true'
        with:
          name: released-upgrade-evidence
          path: .tmp/released-upgrade/evidence/
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: [package, released-upgrade]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: postrove-${{ github.run_id }}
          path: artifacts
      - name: Verify artifact checksums
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS.txt
      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            is_draft=$(gh release view "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')
            test "${is_draft}" = true
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file "${notes}"
            gh release upload "${GITHUB_REF_NAME}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --notes-file "${notes}" \
              --title "Postrove ${GITHUB_REF_NAME}"
          fi
