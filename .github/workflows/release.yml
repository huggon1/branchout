name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}"
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

  macos:
    needs: validate
    runs-on: macos-15
    environment: release-signing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prepare:runtime
      - name: Import Branchout release certificate
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_CERT_SHA256: ${{ secrets.MAC_CERT_SHA256 }}
        run: |
          set -euo pipefail
          keychain_path="${RUNNER_TEMP}/branchout-release.keychain-db"
          p12_path="${RUNNER_TEMP}/branchout-release.p12"
          cert_path="${RUNNER_TEMP}/branchout-release.pem"
          keychain_password=$(openssl rand -base64 32)
          printf '%s' "${MAC_CSC_LINK}" | base64 -D > "${p12_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${p12_path}" -k "${keychain_path}" -P "${MAC_CSC_KEY_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychains+=("${existing_keychain//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychain_path}" "${existing_keychains[@]}"
          security find-certificate -c "Branchout Release Signing" -p "${keychain_path}" > "${cert_path}"
          fingerprint=$(openssl x509 -in "${cert_path}" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':')
          test "${fingerprint}" = "${MAC_CERT_SHA256}"
          security find-identity -v -p codesigning | grep -F "Branchout Release Signing"
          printf 'MAC_CODESIGN_IDENTITY=%s\n' 'Branchout Release Signing' >> "${GITHUB_ENV}"
          printf 'MAC_CODESIGN_KEYCHAIN_PATH=%s\n' "${keychain_path}" >> "${GITHUB_ENV}"
      - run: npm run package:app
      - run: npm run verify:package
      - run: npm run verify:release
        env:
          REQUIRE_SIGNING_AUTHORITY: Branchout Release Signing
      - uses: actions/upload-artifact@v7
        with:
          name: branchout-macos-arm64-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${MAC_CODESIGN_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "${MAC_CODESIGN_KEYCHAIN_PATH}" || true
          fi
          find "${RUNNER_TEMP}" -maxdepth 1 -name 'branchout-release.*' -delete

  windows:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prepare:runtime
      - run: npm run package:app
      - run: npm run verify:package
      - run: npm run verify:release
      - uses: actions/upload-artifact@v7
        with:
          name: branchout-windows-x64-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: branchout-*-${{ github.ref_name }}
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "${RUNNER_TEMP}/release-notes.md" <<'EOF'
          ## Packages

          - macOS Apple Silicon: project-signed DMG and ZIP. This build is not notarized by Apple.
          - Windows x64: unsigned per-user NSIS installer. Windows SmartScreen may show an unknown-publisher warning.

          SHA-256 checksums are included in `SHA256SUMS.txt`.
          EOF
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --title "Branchout ${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
