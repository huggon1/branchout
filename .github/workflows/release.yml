name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}"
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

  package:
    needs: validate
    runs-on: macos-15-arm64
    environment: release-signing
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      REQUIRE_NOTARIZED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require signing and notarization credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CSC_LINK}"
          test -n "${CSC_KEY_PASSWORD}"
          test -n "${APPLE_ID}"
          test -n "${APPLE_APP_SPECIFIC_PASSWORD}"
          test -n "${APPLE_TEAM_ID}"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run prepare:runtime
      - run: npm run package:app
      - run: npm run verify:package
      - run: npm run verify:release
      - uses: actions/upload-artifact@v4
        with:
          name: branchout-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 7

  draft-release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: branchout-${{ github.ref_name }}
          path: artifacts
      - name: Write checksums
        working-directory: artifacts
        run: sha256sum *.dmg *.zip > SHA256SUMS.txt
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "Branchout ${GITHUB_REF_NAME}"
