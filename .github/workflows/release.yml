name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check version and main ancestry
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}"
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

  package:
    needs: validate
    runs-on: macos-15
    environment: release-signing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Import verified project signing certificate
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_CERT_SHA256: ${{ secrets.MAC_CERT_SHA256 }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          : "${MAC_CSC_LINK:?MAC_CSC_LINK is required}"
          : "${MAC_CSC_KEY_PASSWORD:?MAC_CSC_KEY_PASSWORD is required}"
          : "${MAC_CERT_SHA256:?MAC_CERT_SHA256 is required}"
          keychain_path="${RUNNER_TEMP}/branchout-release.keychain-db"
          p12_path="${RUNNER_TEMP}/branchout-release.p12"
          cert_path="${RUNNER_TEMP}/branchout-release.pem"
          cert_der_path="${RUNNER_TEMP}/branchout-release.cer"
          keychain_password=$(openssl rand -base64 32)
          default_keychain=$(security default-keychain -d user | tr -d '"')
          printf '%s' "${MAC_CSC_LINK}" | base64 -D > "${p12_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" "${default_keychain}"
          security import "${p12_path}" -k "${keychain_path}" \
            -P "${MAC_CSC_KEY_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}"
          openssl pkcs12 -in "${p12_path}" -clcerts -nokeys \
            -passin env:MAC_CSC_KEY_PASSWORD -out "${cert_path}"
          openssl x509 -in "${cert_path}" -outform DER -out "${cert_der_path}"
          fingerprint=$(openssl x509 -in "${cert_path}" -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d ':\r\n' | tr '[:lower:]' '[:upper:]')
          expected=$(printf '%s' "${MAC_CERT_SHA256}" | tr '[:lower:]' '[:upper:]')
          test "${fingerprint}" = "${expected}"
          sudo -n security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "${cert_der_path}"
          security find-identity -v -p codesigning "${keychain_path}" \
            | grep -F 'Branchout Release Signing'
          printf 'CSC_NAME=%s\n' 'Branchout Release Signing' >> "${GITHUB_ENV}"
          printf 'CSC_KEYCHAIN=%s\n' "${keychain_path}" >> "${GITHUB_ENV}"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run prepare:runtime
      - run: npm run package:app
      - run: npm run verify:release
        env:
          REQUIRE_SIGNING_AUTHORITY: Branchout Release Signing
      - uses: actions/upload-artifact@v7
        with:
          name: branchout-${{ github.run_id }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 7
      - run: npm run verify:package
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ]; then
            security delete-keychain "${CSC_KEYCHAIN}" || true
          fi
          find "${RUNNER_TEMP}" -maxdepth 1 -name 'branchout-release.*' -delete

  draft-release:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: branchout-${{ github.run_id }}
          path: artifacts
      - name: Write checksums
        working-directory: artifacts
        run: sha256sum *.dmg *.zip > SHA256SUMS.txt
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "Branchout ${GITHUB_REF_NAME}"
