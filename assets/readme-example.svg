<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
  <title id="title">Branchout 内容报告示意</title>
  <desc id="desc">虚构项目 Daymark 的关注卡与一篇离线队列文章的内容报告示例。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eef5ed"/><stop offset="1" stop-color="#e7efeb"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#294b3b" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1100" height="610" rx="28" fill="url(#bg)"/>
  <circle cx="1020" cy="52" r="128" fill="#dbeadf" opacity=".55"/>
  <circle cx="42" cy="585" r="130" fill="#dcebe2" opacity=".55"/>
  <text x="50" y="55" fill="#1b5c4b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="27" font-weight="700">Branchout</text>
  <text x="50" y="86" fill="#6e8177" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14">示意内容 · 虚构项目与文章</text>
  <rect x="50" y="119" width="375" height="419" rx="18" fill="#fff" filter="url(#shadow)"/>
  <rect x="675" y="119" width="375" height="419" rx="18" fill="#fff" filter="url(#shadow)"/>
  <rect x="75" y="144" width="90" height="26" rx="13" fill="#e5f1e9"/>
  <text x="91" y="162" fill="#28735d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" font-weight="600">关注卡</text>
  <text x="75" y="211" fill="#263b34" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="24" font-weight="700">Daymark</text>
  <text x="75" y="242" fill="#809087" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13">本机阅读项目</text>
  <path d="M75 265h325" stroke="#e4ebe5"/>
  <text x="75" y="301" fill="#315c4d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="600">离线保存的恢复体验</text>
  <text x="75" y="335" fill="#52665b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15">我关注保存失败时的状态提示、</text>
  <text x="75" y="361" fill="#52665b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15">重试过程，以及用户如何确认</text>
  <text x="75" y="387" fill="#52665b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15">内容已经保留。</text>
  <rect x="75" y="467" width="73" height="27" rx="13" fill="#e5f1e9"/>
  <text x="98" y="486" fill="#28735d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12">活跃</text>
  <path d="M442 328h204" stroke="#76b59c" stroke-width="3" stroke-linecap="round"/>
  <path d="M635 319l12 9-12 9" fill="none" stroke="#76b59c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="472" y="283" width="145" height="30" rx="15" fill="#d7e9dc"/>
  <text x="491" y="303" fill="#2c6c55" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" font-weight="600">有依据的关联</text>
  <rect x="700" y="144" width="91" height="26" rx="13" fill="#e9f0ea"/>
  <text x="715" y="162" fill="#506f5e" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" font-weight="600">内容报告</text>
  <text x="700" y="210" fill="#263b34" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" font-weight="700">离线队列设计手记</text>
  <text x="700" y="241" fill="#809087" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13">文章内容 · 获取范围已记录</text>
  <path d="M700 265h325" stroke="#e4ebe5"/>
  <text x="700" y="302" fill="#315c4d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="600">与你的关注有关</text>
  <text x="700" y="334" fill="#52665b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14">文章讨论了断网后的保存队列，</text>
  <text x="700" y="358" fill="#52665b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14">以及失败时的提示和重试入口。</text>
  <rect x="700" y="387" width="325" height="91" rx="12" fill="#f2f7f1"/>
  <text x="716" y="415" fill="#678272" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="12" font-weight="600">来源依据</text>
  <text x="716" y="442" fill="#405d4d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14">“恢复连接后按顺序重试；失败时</text>
  <text x="716" y="464" fill="#405d4d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14">保留待处理状态。”</text>
</svg>
